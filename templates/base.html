<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Sistema PDCA / 8D{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">Gerenciador PDCA <span class="brand-accent">/ 8D</span></span>
      <nav class="nav">
        <a href="{{ url_for('nova_reclamacao') }}" class="{{ 'active' if active == 'nova' else '' }}">Nova Reclamação</a>
        <a href="{{ url_for('historico') }}" class="{{ 'active' if active == 'historico' else '' }}">Gerenciador</a>
        <a href="{{ url_for('etapas_8d_page') }}" class="{{ 'active' if active == 'etapas' else '' }}">Etapas 8D</a>
        <a href="{{ url_for('historico_alteracoes') }}" class="{{ 'active' if active == 'auditoria' else '' }}">Histórico de Alterações</a>
      </nav>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
